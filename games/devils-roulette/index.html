<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>惡魔輪盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
:root{--bg:#15110f;--panel:#201915;--line:#3d3027;--bone:#e8e0cf;--dim:#9a8f80;--brass:#c9a24b;--blood:#c23b2e;--steel:#5d7a8a;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(ellipse at 50% 30%,#2a1f19 0,var(--bg) 70%);color:var(--bone);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:12px}
h1{font-family:'Noto Serif TC','Songti TC',serif;font-weight:900;font-size:30px;margin:0;letter-spacing:.12em;color:var(--blood)}
header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.score{color:var(--dim);font-size:14px}
.seat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px}
.seat h2{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.hp{font-size:22px;letter-spacing:2px}
.hp .on{color:var(--brass)}.hp .off{opacity:.18;filter:grayscale(1)}
.tags{font-size:13px;color:var(--blood);min-height:18px}
.items{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;margin-top:6px}
.it{background:#2a211b;border:1px solid var(--line);color:var(--bone);border-radius:4px;padding:6px 9px;font:inherit;font-size:14px;display:flex;gap:5px;align-items:center}
button.it{cursor:pointer}
button.it:hover:not(:disabled){border-color:var(--brass)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.empty{color:var(--dim);font-size:13px;align-self:center}
.table{border:1px dashed var(--line);border-radius:6px;padding:12px;text-align:center}
.chamber{display:flex;justify-content:center;gap:5px;min-height:34px;flex-wrap:wrap}
.shell{width:14px;height:30px;border-radius:3px 3px 2px 2px;background:linear-gradient(to top,var(--brass) 0 28%,var(--c) 28%)}
.shell.L{--c:var(--blood)}.shell.B{--c:var(--steel)}
.count{font-size:13px;color:var(--dim);margin:6px 0}
.status{font-weight:700;margin:8px 0 4px;min-height:24px}
.hint{color:var(--brass);font-size:14px;min-height:20px}
.log{text-align:left;font-size:14px;line-height:1.6;color:var(--dim);margin-top:8px;min-height:118px}
.log div:last-child{color:var(--bone)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acts button{font:inherit;font-weight:700;font-size:16px;padding:14px 8px;border-radius:5px;border:1px solid var(--blood);background:#3a1713;color:var(--bone);cursor:pointer}
.acts button.self{border-color:var(--steel);background:#17262d}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:5}
#flash.L{background:#ff3b2a;animation:f .5s}
#flash.B{background:#8fb4c4;animation:f .3s}
@keyframes f{0%{opacity:.55}100%{opacity:0}}
.hit{animation:s .35s}
@keyframes s{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){#flash.L,#flash.B,.hit{animation:none}}
#ov{position:fixed;inset:0;background:rgba(10,7,6,.92);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
#ov[hidden]{display:none}
.box{max-width:420px;line-height:1.7;font-size:15px}
.box h2{font-family:'Noto Serif TC',serif;font-size:28px;margin:0 0 10px;color:var(--blood)}
.box p{margin:6px 0}
.box button{margin:14px 8px 0 0;font:inherit;font-weight:700;font-size:17px;padding:12px 28px;border-radius:5px;border:1px solid var(--brass);background:var(--brass);color:#1a130e;cursor:pointer}
.box select{font:inherit;font-size:15px;padding:6px;background:#1b1612;color:#e8e0cf;border:1px solid #3d3027;border-radius:4px}
.box input{font:inherit;font-size:18px;padding:8px;width:9em;background:#1b1612;color:var(--bone);border:1px solid var(--line);border-radius:4px;letter-spacing:.2em;text-align:center}
</style>
</head>
<body>
<div id="flash"></div>
<div id="ov"><div class="box" id="box"></div></div>
<main>
<header><h1>惡魔輪盤</h1><div class="score" id="score"></div></header>
<section class="seat" id="dealer"><h2><span>莊家</span><span class="hp" id="hp1"></span></h2><div class="tags" id="tag1"></div><div class="items" id="it1"></div></section>
<section class="table">
<div class="chamber" id="chamber"></div>
<div class="count" id="count"></div>
<div class="status" id="status"></div>
<div class="hint" id="hint"></div>
<div class="log" id="log"></div>
<div class="acts"><button id="shootD">射向莊家</button><button id="shootS" class="self">射向自己</button></div>
</section>
<section class="seat" id="you"><h2><span>你</span><span class="hp" id="hp0"></span></h2><div class="tags" id="tag0"></div><div class="items" id="it0"></div></section>
</main>
<script>
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=n=>Math.floor(Math.random()*n);
const ITEMS={mag:{n:'放大鏡',e:'🔍',d:'查看膛內這一發'},beer:{n:'啤酒',e:'🍺',d:'退掉膛內這一發'},cig:{n:'香菸',e:'🚬',d:'回復 1 點生命'},cuff:{n:'手銬',e:'⛓️',d:'對手跳過下一回合'},saw:{n:'手鋸',e:'🪚',d:'下一發傷害 ×2'},adr:{n:'腎上腺素',e:'💉',d:'偷走對手一個道具並立刻使用'},phone:{n:'手機',e:'📱',d:'得知後面某一發是實彈或空包彈'},inv:{n:'轉換器',e:'🔄',d:'把膛內這一發實彈與空包彈互換'},med:{n:'過期藥品',e:'💊',d:'50% 回復 2 點生命，否則失去 1 點'}};
const KEYS=Object.keys(ITEMS);
const NAME=['{0}','{1}'];
let PVP_HP=0,DPC=null,G,ME=0,ROLE='solo',ROOM=null,hb=null,hello=null,lostT=null;

function start(m){G={mode:m||'std',round:0,cleared:0,wins:[0,0],log:[],busy:false,over:false,steal:false};$('#ov').hidden=true;newRound()}
const $$=n=>'$'+n.toLocaleString('en-US');
function newRound(retry){
  if(!retry)G.round++;
  G.sd=G.mode==='don'?Math.random()<.4:G.round===3;G.max=G.mode==='don'?2+rnd(5):(G.mode==='pvp'&&PVP_HP)?PVP_HP:[2,4,5][G.round-1];G.hp=[G.max,G.max];G.sudden=[false,false];G.items=[[],[]];G.cuff=[false,false];G.saw=false;G.turn=G.mode==='pvp'?(G.round-1)%2:0;G.over=false;G.steal=false;
  say(`—— 第 ${G.round} 回合・雙方各 ${G.max} 點生命${G.mode!=='don'&&G.round===1?'・本回合沒有道具':''}${G.mode==='don'&&G.sd?'・生命降到 1 點時電線剪斷':''} ——`);reload();render();
}
function reload(){
  const n=2+rnd(7),l=1+rnd(n-1);
  G.shells=[...Array(l).fill('L'),...Array(n-l).fill('B')].sort(()=>Math.random()-.5);
  G.known=null;G.phone=null;G.stale=false;G.pub={L:l,B:n-l};
  const k=G.mode==='don'?rnd(5):[0,2,4][G.round-1];
  for(const w of [0,1]){for(let i=0;i<k&&G.items[w].length<8;i++)G.items[w].push(KEYS[rnd(KEYS.length)])}
  say(`裝填完畢：實彈 ${l} 發，空包彈 ${n-l} 發，順序打亂。${k?`雙方各獲得 ${k} 個道具。`:''}`);
}
function say(t){G.log.push(t);if(G.log.length>6)G.log.shift()}
function flash(t){const f=$('#flash');f.className='';void f.offsetWidth;f.className=t}

async function shoot(who,target){
  const s=popShell(),live=s==='L',dmg=G.saw?2:1;
  G.saw=false;
  say(`${NAME[who]}把槍口對準${who===target?'自己':NAME[target]}……`);render();await sleep(800);
  fx(s,live?target:-1);
  if(live){G.hp[target]=Math.max(0,G.hp[target]-dmg);say(`砰！實彈，${NAME[target]}失去 ${dmg} 點生命。`);
    if(G.sd&&G.hp[target]===1&&!G.sudden[target]){G.sudden[target]=true;say(`${NAME[target]}的除顫器電線被剪斷：無法再回血，下一發實彈就會致命。`)}
    }
  else say('喀。空包彈。');
  render();await sleep(700);
  if(G.hp[target]<=0){await roundEnd(1-target);return}
  let next;
  if(target===who&&!live){next=who;say(`${NAME[who]}可以再開一槍。`)}
  else{next=1-who;if(G.cuff[next]){G.cuff[next]=false;say(`${NAME[next]}被手銬銬住，跳過這回合。`);next=who}}
  if(!G.shells.length)reload();
  G.turn=next;render();
}
async function roundEnd(w){
  G.over=true;
  if(G.mode==='pvp'){
    G.wins[w]++;say(`{${w}}贏下第 ${G.round} 回合。`);render();await sleep(1800);
    if(G.wins[w]>=2)showEnd(w);else newRound();
    return;
  }
  if(G.mode==='don'){
    if(w===0){
      G.cleared++;const pot=70000*2**(G.cleared-1);
      say(`你贏下第 ${G.round} 回合。`);render();await sleep(1600);
      box(`第 ${G.round} 回合勝利`,`<p>目前獎金 <b>${$$(pot)}</b>。</p><p>繼續下一回合，獎金翻倍為 ${$$(pot*2)}；但只要倒下，一切歸零。</p>`,
        [['繼續賭',()=>{G.round++;newRound(true)}],['帶著獎金離開',()=>box('你帶著獎金離開了',`<p>共贏下 ${G.cleared} 個回合，獎金 <b>${$$(pot)}</b>。</p>`,[['再玩一次',()=>start('don')],['主選單',menu]])]]);
    }else{
      const lost=G.cleared?70000*2**(G.cleared-1):0;
      render();await sleep(1500);
      box('歸零',`<p>你在第 ${G.round} 回合倒下，${lost?`${$$(lost)} 獎金化為烏有`:'什麼也沒帶走'}。</p>`,[['再玩一次',()=>start('don')],['主選單',menu]]);
    }
    return;
  }
  if(w===0){
    say(`你贏下第 ${G.round} 回合。`);render();await sleep(1800);
    if(G.round>=3)box('你活下來了','莊家倒下，你贏得這場賭局。','再來一局');else newRound();
  }else if(G.round<3){
    say('你倒下了……除顫器把你電醒，這個回合重來。');render();await sleep(2200);newRound(true);
  }else{
    render();await sleep(1500);box('你死了','第三回合的除顫器沒有作用，莊家贏了。','重新開始');
  }
}
function popShell(){
  const s=G.shells.shift(),o=s==='L'?'B':'L';G.known=null;
  if(G.pub[s]>0)G.pub[s]--;else if(G.pub[o]>0)G.pub[o]--;
  if(G.phone){G.phone.idx--;if(G.phone.idx<=0){if(G.phone.idx===0)G.known={who:G.phone.who,v:G.phone.v};G.phone=null}}
  return s;
}
function canUse(who,key){
  const o=1-who;
  if(key==='cuff')return !G.cuff[o];
  if(key==='saw')return !G.saw;
  if(key==='cig'||key==='med')return G.hp[who]<G.max&&!G.sudden[who];
  if(key==='phone')return G.shells.length>1;
  if(key==='adr')return G.items[o].some(k=>k!=='adr'&&canUse(who,k));
  return true;
}
async function useItem(who,idx){
  const key=G.items[who][idx];
  if(!key)return false;
  if(!canUse(who,key)){if(G.mode!=='pvp'&&who===0){say(key==='adr'?'莊家沒有可偷的道具。':'現在用不到這個道具。');render()}return false}
  G.items[who].splice(idx,1);
  if(key==='adr'){G.steal=who+1;say(`{${who}}注射了腎上腺素，正在選擇要偷的道具。`);render();return true}
  await applyItem(who,key);return true;
}
async function useAdr(who,si){
  const o=1-who;G.items[who].splice(G.items[who].indexOf('adr'),1);
  const key=G.items[o].splice(si,1)[0];
  say(`${NAME[who]}注射腎上腺素，偷走了${ITEMS[key].n}並立刻使用。`);render();await sleep(700);await applyItem(who,key);
}
async function stealPick(who,i){
  const o=1-who,key=G.items[o][i];
  if(G.steal!==who+1||!key||key==='adr'||!canUse(who,key))return;
  G.steal=false;G.items[o].splice(i,1);say(`{${who}}偷走了{${o}}的${ITEMS[key].n}並立刻使用。`);render();await sleep(500);await applyItem(who,key);
}
async function applyItem(who,key){
  const o=1-who,V=v=>v==='L'?'實彈':'空包彈';
  if(key==='mag'){G.known={who,v:G.shells[0]};say(who===0&&G.mode!=='pvp'?`你用放大鏡看見：這一發是${V(G.shells[0])}。`:`{${who}}用放大鏡查看了膛內。`)}
  else if(key==='beer'){const s=popShell();say(`${NAME[who]}喝下啤酒，退出一發${V(s)}。`);if(!G.shells.length)reload()}
  else if(key==='cig'){G.hp[who]++;say(`${NAME[who]}抽了一根菸，回復 1 點生命。`)}
  else if(key==='cuff'){G.cuff[o]=true;say(`${NAME[who]}銬住了${NAME[o]}。`)}
  else if(key==='saw'){G.saw=true;say(`${NAME[who]}鋸短了槍管，下一發傷害加倍。`)}
  else if(key==='phone'){const idx=1+rnd(G.shells.length-1),v=G.shells[idx];G.phone={who,idx,v};say(who===0&&G.mode!=='pvp'?`手機傳來訊息：第 ${idx+1} 發是${V(v)}。`:`{${who}}低頭看了一眼手機。`)}
  else if(key==='inv'){G.shells[0]=G.shells[0]==='L'?'B':'L';if(G.known)G.known.v=G.shells[0];G.stale=true;say(`${NAME[who]}按下轉換器，膛內這一發被反轉了。`)}
  else if(key==='med'){
    if(Math.random()<.5){G.hp[who]=Math.min(G.max,G.hp[who]+2);say(`${NAME[who]}吞下過期藥品，回復 2 點生命。`)}
    else{G.hp[who]--;say(`${NAME[who]}吞下過期藥品，失去 1 點生命。`);
      if(G.sd&&G.hp[who]===1&&!G.sudden[who]){G.sudden[who]=true;say(`${NAME[who]}的除顫器電線被剪斷：無法再回血。`)}
      if(G.hp[who]<=0){render();await sleep(700);await roundEnd(o);return}}
  }
  render();await sleep(600);
}

// 莊家 AI：記牌推算 + 道具順序 + 依雙方血量評估風險
async function dealerStep(){
  await sleep(900);
  const it=G.items[1],rem=G.shells.length,has=k=>it.indexOf(k);
  let L=G.pub.L,T=L+G.pub.B;
  if(G.phone&&G.phone.who===1){T--;if(G.phone.v==='L')L--}
  let kv=G.known&&G.known.who===1?G.known.v:null;
  if(kv===null&&!G.stale&&T>0){if(L<=0)kv='B';else if(L>=T)kv='L'}   // 靠計數確定
  const p=kv==='L'?1:kv==='B'?0:T>0?Math.max(0,Math.min(1,L/T)):.5;    // 這一發是實彈的機率
  const me=G.hp[1],foe=G.hp[0],danger=me<=1||G.sudden[1];
  const use=async k=>{await useItem(1,has(k))};
  const aimFoe=p>=.5||(p>0&&foe===1&&p>=.4);
  // 1 補血
  if(me<G.max&&!G.sudden[1]&&has('cig')>=0&&(me<=2||!G.sd||it.length>3))return use('cig');
  if(me>=2&&me<=G.max-2&&!G.sudden[1]&&has('med')>=0)return use('med');
  // 2 不確定時先查看
  if(kv===null&&has('mag')>=0&&rem>1)return use('mag');
  if(kv===null&&has('phone')>=0&&rem>2&&!G.phone)return use('phone');
  // 3 腎上腺素：偷玩家真正用得上的道具
  if(has('adr')>=0){
    const want={cig:me<G.max&&!G.sudden[1],mag:kv===null&&rem>1,cuff:aimFoe&&!G.cuff[0]&&rem>1,phone:kv===null&&rem>2&&!G.phone,saw:aimFoe&&p===1&&!G.saw&&foe>=2};
    const key=Object.keys(want).find(k=>want[k]&&G.items[0].includes(k));
    if(key){await useAdr(1,G.items[0].indexOf(key));return}
  }
  // 4 已知空包彈但想打死殘血玩家：用轉換器變實彈
  if(kv==='B'&&foe<=2&&has('inv')>=0)return use('inv');
  // 5 打玩家之前先銬住，打完還能再動
  if(aimFoe&&!G.cuff[0]&&has('cuff')>=0&&rem>1)return use('cuff');
  // 6 手鋸：確定實彈、或高機率且能打死對手
  if(aimFoe&&!G.saw&&foe>=2&&has('saw')>=0&&(p===1||(foe===2&&p>=.6)))return use('saw');
  // 7 不確定時機率接近一半，或道具塞滿：退彈探底
  if(kv===null&&has('beer')>=0&&rem>2&&(Math.abs(p-.5)<.1||it.length>=7))return use('beer');
  // 8 決定目標
  let target;
  if(kv==='L')target=0;
  else if(kv==='B')target=1;
  else if(danger)target=0;
  else if(foe===1&&p>=.4)target=0;
  else target=p>=.5?0:1;
  await shoot(1,target);
}
function fxLocal(s,t){flash(s);if(t>=0){const el=$(t===ME?'#you':'#dealer');el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit')}}
function fx(s,t){fxLocal(s,t);if(G.mode==='pvp'&&ROOM)ROOM.emit('fx',{s,t}).catch(()=>{})}
async function run(who,fn){
  if(G.turn!==who||G.busy||G.over)return;
  G.busy=true;render();
  await fn();
  if(G.mode!=='pvp')while(G.turn===1&&!G.over)await dealerStep();
  G.busy=false;render();
}
function hostAct(who,a){
  if(!a||typeof a!=='object')return;
  if(a.t==='shoot')return run(who,()=>shoot(who,a.target===1?1:0));
  if(a.t==='item')return run(who,()=>useItem(who,a.idx|0));
  if(a.t==='steal')return run(who,()=>stealPick(who,a.i|0));
}
function act(a){
  if(ROLE==='guest'){if(!G||G.turn!==ME||G.busy||G.over)return;G.busy=true;renderView();ROOM.emit('act',a).catch(()=>{});return}
  return hostAct(ME,a);
}
function pushState(){
  if(!ROOM||ROLE!=='host'||!G||G.mode!=='pvp')return;
  ROOM.emit('state',{round:G.round,max:G.max,hp:G.hp,sudden:G.sudden,items:G.items,cuff:G.cuff,saw:G.saw,turn:G.turn,over:G.over,steal:G.steal,busy:G.busy,wins:G.wins,log:G.log,pub:G.pub,stale:G.stale,n:G.shells.length,sd:G.sd,
    known:G.known&&G.known.who===1?G.known:null,phone:G.phone&&G.phone.who===1?G.phone:null}).catch(()=>{});
}
function render(){renderView();pushState()}
function renderView(){
  const g=G,pvp=g.mode==='pvp',on=pvp?'對手':'莊家',nm=[0,1].map(w=>w===ME?'你':on);
  $('#dealer h2 span').textContent=on;
  $('#score').textContent=pvp?`第 ${g.round} 回合・你 ${g.wins[ME]} : ${g.wins[1-ME]} 對手`:g.mode==='don'?`第 ${g.round} 回合・已贏 ${g.cleared} 回合${g.cleared?'・獎金 '+$$(70000*2**(g.cleared-1)):''}`:`第 ${g.round} / 3 回合`;
  [ME,1-ME].forEach((w,pos)=>{
    $('#hp'+pos).innerHTML=Array.from({length:g.max},(_,i)=>`<span class="${i<g.hp[w]?'on':'off'}">⚡</span>`).join('');
    $('#tag'+pos).textContent=[g.cuff[w]?'⛓️ 被銬住':'',g.saw&&g.turn===w?'🪚 槍管已鋸短':'',g.sudden[w]?'⚡ 電線已剪斷':''].filter(Boolean).join('　');
    const c=$('#it'+pos);
    if(!g.items[w].length){c.innerHTML=`<span class="empty">${(g.mode==='std'||pvp)&&g.round===1?'本回合沒有道具':'沒有道具'}</span>`;return}
    c.innerHTML='';
    g.items[w].forEach((k,i)=>{
      const mine=w===ME,stealing=!mine&&g.steal===ME+1;
      const b=document.createElement(mine||stealing?'button':'span');
      b.className='it';b.title=ITEMS[k].d;b.textContent=`${ITEMS[k].e} ${ITEMS[k].n}`;
      if(mine){b.disabled=g.turn!==ME||g.busy||g.over||!!g.steal;b.onclick=()=>act({t:'item',idx:i});b.setAttribute('aria-label',`${ITEMS[k].n}：${ITEMS[k].d}`)}
      if(stealing){b.disabled=k==='adr'||!canUse(ME,k);b.onclick=()=>act({t:'steal',i})}
      c.appendChild(b);
    });
  });
  const L=g.pub.L,B=g.pub.B;
  $('#chamber').innerHTML=Array(L).fill('<i class="shell L"></i>').join('')+Array(B).fill('<i class="shell B"></i>').join('');
  $('#count').textContent=`膛內剩餘：實彈 ${L}・空包彈 ${B}（順序未知）${g.stale?'・轉換器使用後可能不準':''}`;
  $('#status').textContent=g.over?'':g.steal?(g.steal===ME+1?`選一個${on}的道具偷走`:`${on}正在選擇要偷的道具`):g.turn===ME?(g.busy?'……':'輪到你了'):`${on}的回合`;
  $('#hint').textContent=[g.known&&g.known.who===ME?`你知道：這一發是${g.known.v==='L'?'實彈':'空包彈'}`:'',g.phone&&g.phone.who===ME?`手機：第 ${g.phone.idx+1} 發是${g.phone.v==='L'?'實彈':'空包彈'}`:''].filter(Boolean).join('　');
  $('#log').innerHTML=g.log.map(t=>`<div>${t.replace(/\{(\d)\}/g,(_,d)=>nm[d])}</div>`).join('');
  const off=g.turn!==ME||g.busy||g.over||!!g.steal;
  $('#shootD').disabled=off;$('#shootS').disabled=off;
}
$('#shootD').onclick=()=>act({t:'shoot',target:1-ME});
$('#shootS').onclick=()=>act({t:'shoot',target:ME});

// ---- 與朋友對戰（room 連線：房主負責運算，朋友只收畫面）----
function showEnd(w){
  const win=w===ME;
  box(win?'你贏了':'你輸了',win?'<p>你贏下了這場對決。</p>':'<p>朋友贏下了這場對決。</p>',
    ROLE==='host'?[['再來一局',()=>start('pvp')],['離開',leave]]:[['要求再來一局',()=>{ROOM&&ROOM.emit('rematch',1);box('等待房主…','<p>已通知房主，等他開始下一局。</p>',[['離開',leave]]);}],['離開',leave]]);
}
function leave(){
  clearInterval(hb);clearInterval(hello);clearTimeout(lostT);
  if(ROOM){ROOM.leave().catch(()=>{});ROOM=null}
  try{DPC&&DPC.close()}catch(_){}DPC=null;
  ROLE='solo';ME=0;G=null;menu();
}
// ---- 房間代碼連線：透過公共 MQTT 中繼（WebSocket），只需 6 碼 ----
const BROKERS=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt','wss://test.mosquitto.org:8081'];
function mqttOpen(url,topic,onmsg,onclose){
  return new Promise((res,rej)=>{
    let ws;try{ws=new WebSocket(url,'mqtt')}catch(e){return rej(e)}
    ws.binaryType='arraybuffer';
    const te=new TextEncoder(),td=new TextDecoder();
    const str=x=>{const b=te.encode(x);return [b.length>>8,b.length&255,...b]};
    const rl=n=>{const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d)}while(n>0);return o};
    const pkt=(h,body)=>ws.send(new Uint8Array([h,...rl(body.length),...body]));
    let buf=new Uint8Array(0),ready=false,ping=null;
    const to=setTimeout(()=>{try{ws.close()}catch(_){}rej(new Error('逾時'))},5000);
    ws.onopen=()=>pkt(0x10,[...str('MQTT'),4,2,0,30,...str('dr'+Math.random().toString(36).slice(2,10))]);
    ws.onerror=()=>{if(!ready){clearTimeout(to);rej(new Error('連線被拒或被擋'))}};
    ws.onclose=()=>{clearInterval(ping);if(!ready){clearTimeout(to);rej(new Error('連線被關閉'))}else onclose&&onclose()};
    ws.onmessage=e=>{
      const n=new Uint8Array(e.data),t=new Uint8Array(buf.length+n.length);t.set(buf);t.set(n,buf.length);buf=t;
      while(buf.length>=2){
        let i=1,len=0,m=1,b;
        for(;;){if(i>=buf.length)return;b=buf[i++];len+=(b&127)*m;m*=128;if(!(b&128))break}
        if(buf.length<i+len)return;
        const h0=buf[0],type=h0>>4,body=buf.slice(i,i+len);buf=buf.slice(i+len);
        if(type===2){if(body[1]!==0){clearTimeout(to);rej(new Error('伺服器拒絕'));return}pkt(0x82,[0,1,...str(topic),0])}
        else if(type===9){
          ready=true;clearTimeout(to);ping=setInterval(()=>{try{ws.send(new Uint8Array([0xC0,0]))}catch(_){}},20000);
          res({send:x=>pkt(0x30,[...str(topic),...te.encode(x)]),close:()=>{clearInterval(ping);try{ws.close()}catch(_){}}});
        }else if(type===3){
          const tl=(body[0]<<8)|body[1],qos=(h0>>1)&3;
          onmsg(td.decode(body.slice(2+tl+(qos?2:0))));
        }
      }
    };
  });
}
async function mqttRoom(code){
  const topic='dr-x7/'+code,me=Math.random().toString(36).slice(2),H={},P=[];
  let last=0,alive=false,conn=null,errs=[],closed=false;
  let reopening=false;
  const reopen=async()=>{if(reopening||closed)return;reopening=true;for(let k=0;k<6&&!closed;k++){await new Promise(r=>setTimeout(r,2000));for(const u of BROKERS){try{conn=await mqttOpen(u,topic,dispatch,onClose);reopening=false;link.emit('hello',{});return}catch(e){}}}reopening=false;if(!closed&&ROOM===link)box('連線中斷','<p>與對戰伺服器的連線中斷了。</p>',[['回主選單',leave]])};
  const onClose=()=>{if(!closed)reopen()};
  const dispatch=x=>{try{const [from,t,d]=JSON.parse(x);if(from===me)return;last=Date.now();(H[t]||[]).forEach(f=>f({isMe:false,topic:t,data:d}))}catch(_){}};
  for(const u of BROKERS){try{conn=await mqttOpen(u,topic,dispatch,onClose);break}catch(e){errs.push(u.split('/')[2]+'：'+(e&&(e.message||e.name)||'失敗'))}}
  if(!conn)throw new Error(errs.join('；'));
  const tm=setInterval(()=>{const a=Date.now()-last<9000;if(alive&&!a)P.forEach(f=>f({left:[{}]}));alive=a},2000);
  const link={
    emit(t,d){try{conn.send(JSON.stringify([me,t,d]))}catch(_){}return Promise.resolve()},
    on(t,f){(H[t]=H[t]||[]).push(f);return()=>{}},
    onPeers(f){P.push(f);return()=>{}},
    peers(){return Date.now()-last<9000?[{kind:'viewer'},{kind:'viewer'}]:[{kind:'viewer'}]},
    leave(){closed=true;clearInterval(tm);clearInterval(kp);conn.close();return Promise.resolve()}};
  const kp=setInterval(()=>link.emit('ping',0),3000);
  document.addEventListener&&document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!closed){link.emit('hello',{});if(ROLE==='host')pushState()}});
  return link;
}
let mtok=null;
async function mconnect(role){
  let code=($('#code').value||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  if(role==='host')PVP_HP=+($('#hpsel')&&$('#hpsel').value)||0;
  if(role==='host')code=Array.from({length:6},()=>'abcdefghjkmnpqrstuvwxyz23456789'[rnd(31)]).join('');
  else if(code.length<4){lobby();return}
  const tok=mtok=Math.random();
  box(role==='host'?'建立房間':'加入房間',`${role==='host'?`<p>房間代碼：<b style="font-size:28px;letter-spacing:.15em">${code}</b></p>`:''}<p>正在連線到對戰伺服器…（最多約 15 秒）</p>`,[['取消',()=>{mtok=null;menu()}]]);
  let r;
  try{r=await mqttRoom(code)}catch(e){if(tok===mtok)box('無法連線',`<p>連不上對戰伺服器。請確認網路後重試；公司或學校網路可能會擋住這類連線。若你是在 claude.ai 的網頁連結裡開啟，連線會被平台擋住，請改用下載的 HTML 檔。</p><p style="font-size:12px;color:#9a8f80">${e&&e.message||e}</p>`,[['返回',menu]]);return}
  if(tok!==mtok){r.leave();return}
  ROOM=r;setup(role,code);
}
function lobby(){
  box('與朋友對戰','<p>兩人各用自己的裝置，輪流對著對方開槍。三回合，先贏兩回合者勝，沒有除顫器復活。</p><p>房主按「建立房間」會得到 6 碼代碼，傳給朋友；朋友輸入代碼後按「加入房間」。兩人都要連上網路，朋友開啟同一個 HTML 檔即可。</p><p>血量（房主設定）：<select id="hpsel" aria-label="血量"><option value="0">依回合遞增（2 / 4 / 5）</option>'+[2,3,4,5,6,7,8].map(n=>`<option value="${n}">每回合 ${n} 點</option>`).join('')+'</select></p><p><input id="code" maxlength="6" placeholder="房間代碼" aria-label="房間代碼" autocomplete="off"></p>',
    [['建立房間',()=>mconnect('host')],['加入房間',()=>mconnect('guest')],['返回',menu]]);
}
function lobbyRoom(){
  box('與朋友對戰','<p>兩人各用自己的裝置，輪流對著對方開槍。規則同標準模式：三回合，先贏兩回合者勝，沒有除顫器復活。</p><p>房主按「建立房間」（代碼可留空自動產生）；朋友開啟同一個頁面連結，輸入代碼後按「加入房間」。</p><p><input id="code" maxlength="8" placeholder="房間代碼" aria-label="房間代碼" autocomplete="off"></p>',
    [['建立房間',()=>connect('host')],['加入房間',()=>connect('guest')],['返回',menu]]);
}
async function connect(role){
  let code=($('#code').value||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!code){if(role==='guest'){lobby();return}code=String(1000+rnd(9000))}
  const fail=m=>box('無法連線',`<p>${m}</p>`,[['返回',menu]]);
  let room=null;
  try{room=await claude.use('room')}catch(e){}
  if(!room)return fail('目前無法使用多人連線。請登入 claude.ai，並用分享連結開啟這個頁面。');
  try{ROOM=await room.join('devils-'+code)}catch(e){return fail('加入房間失敗，請稍後再試。')}
  setup(role,code);
}
function setup(role,code,direct){
  const nb=direct?()=>{}:box;
  ROLE=role;ME=role==='host'?0:1;G=null;
  ROOM.onPeers(c=>{if(c.left.length&&G&&G.mode==='pvp'){clearTimeout(lostT);lostT=setTimeout(()=>{if(ROOM&&ROOM.peers().filter(p=>p.kind==='viewer').length<2)box('對手暫時沒有回應','<p>可能是對方切到別的 App 或網路不穩。</p>',[['繼續等待',()=>{}],['回主選單',leave]])},6000)}});
  if(role==='host'){
    ROOM.on('hello',m=>{if(m.isMe)return;if(!G||G.mode!=='pvp')start('pvp');else pushState()});
    ROOM.on('act',m=>{if(!m.isMe&&G&&G.mode==='pvp')hostAct(1,m.data)});
    ROOM.on('rematch',m=>{if(!m.isMe&&G&&G.mode==='pvp'&&G.over&&(G.wins[0]>=2||G.wins[1]>=2))start('pvp')});
    hb=setInterval(pushState,3000);
    nb('等待朋友加入',`<p>房間代碼：<b style="font-size:28px;letter-spacing:.15em">${code}</b></p><p>血量：${PVP_HP?'每回合 '+PVP_HP+' 點':'依回合遞增（2 / 4 / 5）'}</p><p>把代碼傳給朋友，請他開啟同一個 HTML 檔，選「與朋友對戰」→ 輸入代碼 → 按「加入房間」。</p>`,[['取消',leave]]);
  }else{
    ROOM.on('state',m=>{
      if(m.isMe||!m.data)return;
      clearInterval(hello);
      G={...m.data,mode:'pvp',shells:Array(m.data.n).fill('?')};
      renderView();
      if(!G.over)$('#ov').hidden=true;
      else if(G.wins[0]>=2||G.wins[1]>=2){if($('#ov').hidden)showEnd(G.wins[0]>=2?0:1)}
    });
    ROOM.on('fx',m=>{if(!m.isMe&&m.data)fxLocal(m.data.s,m.data.t)});
    const ping=()=>ROOM&&ROOM.emit('hello',{}).catch(()=>{});
    ping();hello=setInterval(ping,2000);
    nb('正在加入房間…',`<p>房間代碼 <b>${code}</b>。等房主開始遊戲。</p>`,[['取消',leave]]);
  }
}

function box(t,p,b){
  const bs=typeof b==='string'?[[b,()=>start(G.mode)]]:b;
  $('#box').innerHTML=`<h2>${t}</h2>${p}<div id="bb"></div>`;
  bs.forEach(([l,f])=>{const x=document.createElement('button');x.textContent=l;x.onclick=async()=>{$('#ov').hidden=true;if(await f()==='keep')$('#ov').hidden=false};$('#bb').appendChild(x)});
  $('#ov').hidden=false;$('#bb button')?.focus();
}
function menu(){
  box('惡魔輪盤','<p>你和莊家輪流對著對方開槍。霰彈槍裡裝著隨機順序的實彈與空包彈，每次裝填前會告知兩者數量。</p><p><b>射向自己：</b>空包彈可以再開一槍；實彈則扣血。<br><b>射向對手：</b>實彈扣血，之後換對方。</p><p><b>標準模式：</b>三個回合，第 1 回合 2 點生命、沒有道具；第 2 回合 4 點生命、各得 2 個道具；第 3 回合 5 點生命、各得 4 個道具。前兩回合輸了會被電醒重來；第 3 回合生命降到 1 點時電線剪斷，無法回血，再中一發就真的死了。</p><p><b>雙倍或零：</b>無限回合，每回合的生命（2 到 6 點）、道具數量和是否剪斷電線都是隨機的。贏下第一回合得 $70,000，之後每多贏一回合獎金翻倍，每回合結束可以帶錢離開；一旦倒下，一切歸零，沒有復活。</p><p><b>與朋友對戰：</b>兩人各用自己的裝置，房主建立房間後把 6 碼代碼傳給朋友就能連線，規則同標準模式、沒有除顫器復活，先贏兩回合者勝。</p><p>道具不會結束回合：放大鏡、啤酒、香菸、手銬、手鋸、腎上腺素、手機、轉換器、過期藥品。</p>',[['標準模式',()=>start('std')],['雙倍或零',()=>start('don')],['與朋友對戰',lobby]]);
}
menu();
